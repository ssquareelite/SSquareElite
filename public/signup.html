<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — ToyLand</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a class="nav-logo" href="/index.html"><span>🧸</span> SSQUARE ELITE</a>
  <ul class="nav-links"></ul>
  <div class="nav-actions"><div class="nav-account" id="navAccount"></div></div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Join ToyLand 🎉</h1>
    <p class="auth-sub">Create an account to start shopping</p>
    <div class="auth-error" id="authError"></div>
    <form id="signupForm">
      <div class="form-field">
        <label for="name">Full name</label>
        <input type="text" id="name" required autocomplete="name">
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-auth" id="submitBtn">Create Account</button>
    </form>
    <div class="auth-switch">Already have an account? <a href="/login.html">Log in</a></div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('authError');
  const btn = document.getElementById('submitBtn');
  errEl.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Creating account…';
  try {
    await api('/auth/signup', {
      method: 'POST',
      body: JSON.stringify({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    location.href = '/index.html';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Create Account';
  }
});
</script>
</body>
</html>
