<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — ToyLand</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a class="nav-logo" href="/index.html"><span>🧸</span> SSQUARE ELITE</a>
  <ul class="nav-links"></ul>
  <div class="nav-actions"><div class="nav-account" id="navAccount"></div></div>
</nav>

<div id="adminRoot">
  <p style="text-align:center;padding:3rem;color:var(--text-muted);font-weight:600;">Checking access…</p>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
<script>
let editingId = null;

async function init() {
  const user = await refreshNavAccount();
  if (!user || user.role !== 'admin') {
    document.getElementById('adminRoot').innerHTML = `
      <div class="admin-denied">
        🔒 This page is for the store owner only.<br>
        <a href="/index.html" style="color:var(--primary);font-weight:800;">Back to store</a>
      </div>`;
    return;
  }
  renderPage();
  loadProducts();
}

function renderPage() {
  document.getElementById('adminRoot').innerHTML = `
    <div class="admin-page">
      <h1>🛠️ Manage Toys</h1>
      <div class="admin-grid">
        <div class="admin-card">
          <h2 id="formTitle">Add a new toy</h2>
          <form id="productForm">
            <div class="admin-field">
              <label>Name</label>
              <input type="text" id="f_name" required placeholder="e.g. Night Panda Lamp">
            </div>
            <div class="admin-field">
              <label>Description</label>
              <input type="text" id="f_description" placeholder="e.g. Warm cozy glow">
            </div>
            <div class="admin-row">
              <div class="admin-field">
                <label>Price (₹)</label>
                <input type="number" id="f_price" required min="0" step="1">
              </div>
              <div class="admin-field">
                <label>Old price (₹, optional)</label>
                <input type="number" id="f_oldPrice" min="0" step="1">
              </div>
            </div>
            <div class="admin-row">
              <div class="admin-field">
                <label>Category</label>
                <select id="f_category">
                  <option value="toys">Toys</option>
                  <option value="gifts">Gift Sets</option>
                  <option value="lamp">Lamps</option>
                </select>
              </div>
              <div class="admin-field">
                <label>Badge</label>
                <select id="f_badge">
                  <option value="">None</option>
                  <option value="sale">Sale</option>
                  <option value="new">New</option>
                  <option value="hot">Hot</option>
                </select>
              </div>
            </div>
            <div class="admin-row">
              <div class="admin-field">
                <label>Rating</label>
                <select id="f_rating">
                  <option value="★★★★★">★★★★★</option>
                  <option value="★★★★☆" selected>★★★★☆</option>
                  <option value="★★★☆☆">★★★☆☆</option>
                </select>
              </div>
              <div class="admin-field">
                <label>Stock</label>
                <input type="number" id="f_stock" value="100" min="0">
              </div>
            </div>
            <div class="admin-field">
              <label>Product image (jpg/png/webp, max 5MB)</label>
              <input type="file" id="f_image" accept=".jpg,.jpeg,.png,.webp,.gif">
              <div class="admin-hint">Or leave blank and use an emoji instead ↓</div>
            </div>
            <div class="admin-field">
              <label>Emoji fallback (used only if no image uploaded)</label>
              <input type="text" id="f_imageEmoji" placeholder="e.g. 🧸" maxlength="4">
            </div>
            <button type="submit" class="btn-admin-submit" id="submitBtn">Add Toy</button>
            <button type="button" class="btn-admin-submit" id="cancelEditBtn" style="display:none;background:var(--text-muted);margin-top:0.5rem;" onclick="cancelEdit()">Cancel edit</button>
          </form>
        </div>

        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr><th>Image</th><th>Name</th><th>Price</th><th>Category</th><th>Badge</th><th>Stock</th><th></th></tr>
            </thead>
            <tbody id="productRows"><tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text-muted);">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  `;
  document.getElementById('productForm').addEventListener('submit', submitForm);
}

async function loadProducts() {
  try {
    const { products } = await api('/admin/products');
    const rows = document.getElementById('productRows');
    if (!products.length) {
      rows.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text-muted);">No toys yet — add your first one!</td></tr>';
      return;
    }
    rows.innerHTML = products.map((p) => {
      const thumb = (p.image.startsWith('img/') || p.image.startsWith('http'))
        ? `<img class="admin-thumb" src="${p.image}" alt="${p.name}">`
        : `<span class="admin-thumb-emoji">${p.image}</span>`;
      return `<tr>
        <td>${thumb}</td>
        <td>${p.name}</td>
        <td>₹${p.price.toLocaleString()}${p.oldPrice ? ` <span style="color:var(--text-muted);text-decoration:line-through;">₹${p.oldPrice.toLocaleString()}</span>` : ''}</td>
        <td>${p.category}</td>
        <td>${p.badge || '—'}</td>
        <td>${p.stock}</td>
        <td class="admin-actions-cell">
          <button class="btn-mini edit" onclick='startEdit(${JSON.stringify(p).replace(/'/g, "&apos;")})'>Edit</button>
          <button class="btn-mini delete" onclick="deleteProduct('${p._id}')">Delete</button>
        </td>
      </tr>`;
    }).join('');
  } catch (err) {
    showToast(err.message);
  }
}

function startEdit(p) {
  editingId = p._id;
  document.getElementById('formTitle').textContent = `Editing: ${p.name}`;
  document.getElementById('f_name').value = p.name;
  document.getElementById('f_description').value = p.description || '';
  document.getElementById('f_price').value = p.price;
  document.getElementById('f_oldPrice').value = p.oldPrice || '';
  document.getElementById('f_category').value = p.category;
  document.getElementById('f_badge').value = p.badge || '';
  document.getElementById('f_rating').value = p.rating || '★★★★☆';
  document.getElementById('f_stock').value = p.stock;
  document.getElementById('f_imageEmoji').value = (!p.image.startsWith('img/') && !p.image.startsWith('http')) ? p.image : '';
  document.getElementById('submitBtn').textContent = 'Save Changes';
  document.getElementById('cancelEditBtn').style.display = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
  editingId = null;
  document.getElementById('productForm').reset();
  document.getElementById('formTitle').textContent = 'Add a new toy';
  document.getElementById('submitBtn').textContent = 'Add Toy';
  document.getElementById('cancelEditBtn').style.display = 'none';
}

async function submitForm(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = editingId ? 'Saving…' : 'Adding…';

  const formData = new FormData();
  formData.append('name', document.getElementById('f_name').value);
  formData.append('description', document.getElementById('f_description').value);
  formData.append('price', document.getElementById('f_price').value);
  formData.append('oldPrice', document.getElementById('f_oldPrice').value);
  formData.append('category', document.getElementById('f_category').value);
  formData.append('badge', document.getElementById('f_badge').value);
  formData.append('rating', document.getElementById('f_rating').value);
  formData.append('stock', document.getElementById('f_stock').value);
  const emoji = document.getElementById('f_imageEmoji').value;
  if (emoji) formData.append('imageEmoji', emoji);
  const fileInput = document.getElementById('f_image');
  if (fileInput.files[0]) formData.append('image', fileInput.files[0]);

  try {
    const url = editingId ? `/api/admin/products/${editingId}` : '/api/admin/products';
    const res = await fetch(url, {
      method: editingId ? 'PATCH' : 'POST',
      credentials: 'include',
      body: formData
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    showToast(editingId ? 'Toy updated!' : 'Toy added!');
    cancelEdit();
    loadProducts();
  } catch (err) {
    showToast(err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = editingId ? 'Save Changes' : 'Add Toy';
  }
}

async function deleteProduct(id) {
  if (!confirm('Delete this toy? This cannot be undone.')) return;
  try {
    await api(`/admin/products/${id}`, { method: 'DELETE' });
    showToast('Toy deleted');
    loadProducts();
  } catch (err) {
    showToast(err.message);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

init();
</script>
</body>
</html>
